# ZJU-AC 配置（UTF-8）。修改后重启程序生效；启动只需 python -m zju_ac。
# 学号、密码和 Cookie 不写在这里，仍通过终端登录。

[runtime]
# monitor：按 checkin 配置处理；reminders：只提醒；once：只查询一次；demo：离线通知演示。
mode = "monitor"
interval = 15                 # 轮询间隔秒数，至少 5。
remind_every = 0              # 0 表示只提醒一次；重复提醒须至少 5 秒。
login_timeout = 180           # 登录时间预算秒数，至少 5。

[checkin]
auto_checkin = true           # 默认自动签到；false：终端输入 y/yes 并回车确认。
gate = "attendance"          # attendance：按下方人数门控；immediate：直接签到。
# 自动缺码按下方配置低频重读；手动模式可补输课堂公布的码。

[checkin.code_retry]
max_attempts = 5              # 含首次，允许 1–5 轮；每轮最多两个只读取码通道。
interval_seconds = 30         # 上轮结束后至少等 30 秒；不会压缩间隔赶截止时间。
# 只重读取码，不枚举数字，不重试签到提交；进程重启后计数重新开始。

[checkin.gate_settings]
# 两条人数条件任一满足即放行；“超过”是严格大于，等于阈值仍等待。
signed_ratio = 0.25           # 已签人数 > 全班人数 × 此比例。
signed_count = 20             # 或已签人数 > 此人数。
max_wait_seconds = 120        # 从首次检测起等待达到此秒数，直接放行。
min_remaining_seconds = 30    # 距结束不超过此秒数，直接放行；已结束则取消。
poll_interval_seconds = 5     # 等待期间查询名单的间隔秒数。
# 拿不到有效完整名单时直接放行；放行后仍检查活动和本人状态。

[notifications]
desktop = true
bell = true

[watchdog]
enabled = true
restart_delay = 15            # 重启等待秒数，至少 1。
max_restarts = 5              # 滚动 10 分钟内最多重启次数，至少 1。

[gps]
# 只提交选定地点一次，不遍历列表、不探测距离、不读取电脑的真实 GPS。
# 请按实际上课地点修改 location；也可修改或新增下方坐标。示例不能保证覆盖你的课堂。
location = "ZJGB1"
accuracy = 35.0               # 接口精度字段，单位米，不代表真实测量精度。

# 参考来源（上游数组顺序为 经度、纬度；本配置使用显式字段避免填反）：
