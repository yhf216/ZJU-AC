# ZJU-AC 配置（UTF-8）。修改后重启程序生效；启动只需 python -m zju_ac。
# 学号、密码和 Cookie 不写在这里，仍通过终端登录。

[runtime]
# monitor：按 checkin 配置处理；reminders：只提醒；once：只查询一次；demo：离线通知演示。
mode = "monitor"
interval = 15                 # 轮询间隔秒数，至少 5。
remind_every = 0              # 0 表示只提醒一次；重复提醒须至少 5 秒。
login_timeout = 180           # 登录时间预算秒数，至少 5。

[checkin]
auto_checkin = false          # true：自动签到；false：终端输入 y/yes 并回车确认。
gate = "immediate"           # 目前仅支持 immediate（直接签到），待后续扩展门控条件。
# 自动取不到数字码时仅提醒、不提交；手动模式可补输课堂公布的码。

[notifications]
desktop = true
bell = true

[watchdog]
enabled = true
restart_delay = 15            # 重启等待秒数，至少 1。
max_restarts = 5              # 滚动 10 分钟内最多重启次数，至少 1。

[gps]
# 只提交选定地点一次，不遍历列表、不探测距离、不读取电脑的真实 GPS。
# 请按实际上课地点修改 location；也可修改或新增下方坐标。示例不能保证覆盖你的课堂。
location = "ZJGD1"
accuracy = 35.0               # 接口精度字段，单位米，不代表真实测量精度。

# 参考来源（上游数组顺序为 经度、纬度；本配置使用显式字段避免填反）：
# https://github.com/5dbwat4/ZJU-live-better/blob/main/courses.zju/autosign.js
